name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: relogio-zap-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na release "teste"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk relogio-zap-teste.apk
          gh release delete teste -y --cleanup-tag || true
          gh release create teste relogio-zap-teste.apk --title "APK de teste" --notes "Build de ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
