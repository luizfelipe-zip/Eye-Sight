name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para publicar como release (ex.: v1.0.0). Vazio = só compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compilar
        run: sh build.sh

      - name: Empacotar
        run: |
          cd build
          zip -r EyeSight-Instalador.zip EyeSight-Instalador
          zip -r EyeSight-Desinstalador.zip EyeSight-Desinstalador

      - uses: actions/upload-artifact@v4
        with:
          name: EyeSight
          path: |
            build/EyeSight-Instalador.zip
            build/EyeSight-Desinstalador.zip

      - name: Substituir release existente da mesma versão
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.version }}" --cleanup-tag --yes || true

      - name: Notas da release (seção da versão no CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: |
          v="${{ inputs.version || github.ref_name }}"
          awk -v v="${v#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > build/notas.md
          test -s build/notas.md || echo "Veja o [CHANGELOG](CHANGELOG.md)." > build/notas.md
          cat >> build/notas.md <<'EOF'

          ---
          - **Instalar:** baixe `EyeSight-Instalador.zip`, extraia e dê dois cliques em `Instalar.cmd` (pede administrador).
          - **Remover:** baixe `EyeSight-Desinstalador.zip`, extraia e dê dois cliques em `Desinstalar.cmd`.
          - Deixe a Luz noturna do Windows desligada e use a Luz quente do Eye Sight no lugar.
          EOF
          sed -i 's/^          //' build/notas.md
          cat build/notas.md

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Eye Sight ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            build/EyeSight-Instalador.zip
            build/EyeSight-Desinstalador.zip
          body_path: build/notas.md
